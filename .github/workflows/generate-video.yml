name: Generate Video

on:
  repository_dispatch:
    types: [trigger-video-generation]
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche keyword (e.g. Tech Tools)"
        required: false
        default: "Tech Tools"

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  NICHE: ${{ github.event.client_payload.niche || inputs.niche || 'Tech Tools' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Ensure Remotion browser (bundled Chrome Headless Shell)
        run: npx remotion browser ensure

      - name: Render KineticPromo composition
        run: |
          npx remotion render KineticPromo out/promo.mp4 \
            --codec=h264 --concurrency=2 --crf=18

      - name: Verify output with ffprobe
        run: |
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
            -of default=noprint_wrappers=1 out/promo.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: promo
          path: out/promo.mp4
          if-no-files-found: error
