name: Generate SSS-Grade Video

on:
  repository_dispatch:
    types: [trigger-video-generation]
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche keyword (e.g. AI Agents, SaaS Tools, Crypto, Wellness)"
        required: true
        default: "AI Agents"
      composition:
        description: "Remotion Composition to render"
        required: true
        default: "NicheExplainer"
        type: choice
        options:
          - NicheExplainer
          - ViralDocumentary
          - KineticPromo
      duration_seconds:
        description: "Video duration in seconds (30-60)"
        required: true
        default: "60"

permissions:
  contents: write
  actions: write
  attestations: write
  checks: write
  discussions: write
  id-token: write
  issues: write
  pages: write
  pull-requests: write
  repository-projects: write
  security-events: write
  statuses: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install ffmpeg and dependencies
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live trends for niche
        run: python fetch_trends.py "${{ inputs.niche }}"
        env:
          NICHE: ${{ inputs.niche }}

      - name: Generate AI script & scene plan (OpenCode / OmniRoute)
        run: python scripts/generate_script.py
        env:
          NICHE: ${{ inputs.niche }}
          OPENCODE_TARGET: "http://localhost:20128/v1"
          OPENCODE_KEY: ${{ secrets.OMNIROUTE_API_KEY || 'sk_omniroute' }}
          OPENCODE_MODELS: "auto/coding,oc/deepseek-v4-flash-free"

      - name: Ensure Remotion browser (bundled Chrome Headless Shell)
        run: npx remotion browser ensure

      - name: Create output directory
        run: mkdir -p out

      - name: Render Remotion composition
        run: |
          # Calculate duration in frames (30 fps)
          DUR_SEC="${{ inputs.duration_seconds }}"
          FPS="30"
          FRAMES=$(( DUR_SEC * FPS ))
          echo "Rendering composition ${{ inputs.composition }} for ${DUR_SEC}s (${FRAMES} frames)..."

          npx remotion render "${{ inputs.composition }}" out/promo.mp4 \
            --props=data/scene.json \
            --frames=0-$(( FRAMES - 1 )) \
            --codec=h264 --concurrency=2 --crf=18

      - name: Verify output with ffprobe
        run: ffprobe -v error -select_streams v:0 \
          -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
          -of default=noprint_wrappers=1 out/promo.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: promo-${{ inputs.composition }}
          path: out/promo.mp4
          if-no-files-found: error
